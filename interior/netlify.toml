# Netlify 배포 설정 (저장소 루트가 아니라 interior 폴더가 사이트예요)
# Netlify 화면에서 Base directory 를 "interior" 로 지정하면 아래 설정이 적용됩니다.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
