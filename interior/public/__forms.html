<!doctype html>
<!--
  Netlify Forms 감지용 파일입니다. 화면에는 보이지 않아요.
  Next.js 정적 사이트는 폼을 자바스크립트로 그리기 때문에, Netlify가 배포할 때 이 HTML을 읽고 폼을 등록합니다.
  src/components/Contact.tsx 의 입력 칸 name 을 바꾸면 여기도 똑같이 바꿔 주세요.
-->
<html lang="ko">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>forms</title></head>
  <body>
    <form name="project-inquiry" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="project-inquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="space_type" />
      <input name="work_type" />
      <input name="area" />
      <input name="region" />
      <input name="budget" />
      <input name="timing" />
      <textarea name="message"></textarea>
      <input name="attachment1" type="file" />
      <input name="attachment2" type="file" />
      <input name="attachment3" type="file" />
      <input name="consent" type="checkbox" />
    </form>
  </body>
</html>
